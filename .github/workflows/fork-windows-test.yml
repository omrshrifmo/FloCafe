name: Build and Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - origin
      - main
    tags:
      - '3.*'
      - 'v3.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Check Windows signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTS_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Warning "WINDOWS_CERTS/WINDOWS_CERTS_PASSWORD not set — building an UNSIGNED Windows installer."
          } else {
            Write-Host "Windows signing credentials present."
          }

      - name: Build Windows Installer
        shell: bash
        run: |
          npm run build:frontend && npm run build && npx electron-builder --win --publish never --config.npmRebuild=false -c.publish.channel="latest" -w nsis
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTS_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: flocafe-3.11.1-win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Upload Windows executable to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 3.11.1
          name: 3.11.1
          body: |
            ## Flo Cafe 3.11.1

            Flo Cafe Windows Installer v3.11.1 with Arabic localization support.

            ### Downloads
            - **Windows x64 Installer (.exe):** [flocafe-3.11.1-win-x64.exe](https://github.com/omrshrifmo/FloCafe2/releases/download/3.11.1/flocafe-3.11.1-win-x64.exe)
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
